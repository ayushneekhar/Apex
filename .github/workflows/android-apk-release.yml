name: Android APK Release

on:
  # Called by ci.yml when native changes are detected
  workflow_call:
  # Manual trigger for on-demand builds
  workflow_dispatch:
    inputs:
      build_environment:
        description: GitHub Environment to load secrets/vars from
        type: choice
        required: true
        default: production
        options:
          - development
          - production
      build_type:
        description: APK flavor to build
        type: choice
        required: true
        default: production
        options:
          - development
          - production

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false   # NEVER cancel a running native build — queue instead

jobs:
  # ── Build APK + create GitHub release ──────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.build_environment || 'production' }}
    env:
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_DRIVE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_DRIVE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_DRIVE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_DRIVE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_NITRO_OTA_GITHUB_URL: ${{ vars.EXPO_PUBLIC_NITRO_OTA_GITHUB_URL }}
      EXPO_PUBLIC_NITRO_OTA_VERSION_PATH: ${{ vars.EXPO_PUBLIC_NITRO_OTA_VERSION_PATH }}
      EXPO_PUBLIC_NITRO_OTA_ANDROID_REF: ${{ vars.EXPO_PUBLIC_NITRO_OTA_ANDROID_REF }}
      EXPO_PUBLIC_NITRO_OTA_IOS_REF: ${{ vars.EXPO_PUBLIC_NITRO_OTA_IOS_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches ~/.gradle (wrapper, dependencies, build cache). Cache is only
      # written from the default branch, which is where native builds run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # C++ (new arch, Skia, Nitro modules) dominates build time and isn't
      # covered by the Gradle build cache — ccache it instead.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache-${{ inputs.build_type || 'production' }}
          max-size: 2G

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if yarn --version | grep -q '^1\.'; then
            yarn install --frozen-lockfile
          else
            yarn install --immutable
          fi

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/apex-upload-key.jks
          printf 'storeFile=app/apex-upload-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${ANDROID_KEYSTORE_PASSWORD}" "${ANDROID_KEY_ALIAS}" "${ANDROID_KEY_PASSWORD}" \
            > android/keystore.properties

      - name: Validate required environment variables
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_SPOTIFY_CLIENT_ID}" ]; then
            echo "Missing EXPO_PUBLIC_SPOTIFY_CLIENT_ID for environment." >&2
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_GOOGLE_DRIVE_ANDROID_CLIENT_ID}" ]; then
            echo "Missing EXPO_PUBLIC_GOOGLE_DRIVE_ANDROID_CLIENT_ID for environment." >&2
            exit 1
          fi

      # ── Bump build counters ─────────────────────────────────
      # Every native build gets a fresh versionCode (so OTAs built for older
      # binaries stop targeting it) and a fresh OTA version (embedded in the
      # APK's JS and published as the matching OTA below).
      - name: Bump versionCode and OTA bundle version
        id: counters
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.build_environment || 'production' }}
        run: |
          set -euo pipefail

          COUNTER_FILE="scripts/ota/ota-bundle-version.json"

          read -r VERSION_CODE OTA_VERSION < <(node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(app.expo.android.versionCode || 0) + 1;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\\n');

            const counters = JSON.parse(fs.readFileSync('${COUNTER_FILE}', 'utf8'));
            counters['${DEPLOYMENT_ENVIRONMENT}'] = Number(counters['${DEPLOYMENT_ENVIRONMENT}'] || 0) + 1;
            fs.writeFileSync('${COUNTER_FILE}', JSON.stringify(counters, null, 2) + '\\n');

            console.log(app.expo.android.versionCode, counters['${DEPLOYMENT_ENVIRONMENT}']);
          ")

          echo "versionCode → ${VERSION_CODE}, ${DEPLOYMENT_ENVIRONMENT} OTA version → ${OTA_VERSION}"
          echo "ota_version=${OTA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "EXPO_PUBLIC_BUNDLED_OTA_VERSION=${OTA_VERSION}" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json "${COUNTER_FILE}"
          git commit -m "chore(release): bump android versionCode to ${VERSION_CODE}, ${DEPLOYMENT_ENVIRONMENT} OTA to ${OTA_VERSION} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ── Resolve version & tag ────────────────────────────────
      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          # Determine build type
          BUILD_TYPE="${{ inputs.build_type || 'production' }}"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

          # Build the tag name
          TAG="v${APP_VERSION}+${VERSION_CODE}"

          # Check if this tag already exists; if so, add a run-number suffix
          if git tag -l "$TAG" | grep -q .; then
            TAG="${TAG}.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        env:
          # Real devices only — x86/x86_64 are emulator ABIs and double the C++ work.
          REACT_NATIVE_ARCHITECTURES: arm64-v8a,armeabi-v7a
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CCACHE_COMPILERCHECK: content
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"

          GRADLE_ARGS=(
            --build-cache
            --parallel
            -PreactNativeArchitectures="${REACT_NATIVE_ARCHITECTURES}"
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"
          )

          cd android
          if [ "${BUILD_TYPE}" = "production" ]; then
            echo "Building production APK (assembleRelease)"
            # lintVital only reports fatal lint issues; not worth ~minutes per release.
            NODE_ENV=production ./gradlew assembleRelease -x lintVitalRelease "${GRADLE_ARGS[@]}"
          else
            echo "Building development APK (assembleDebug)"
            NODE_ENV=development ./gradlew assembleDebug "${GRADLE_ARGS[@]}"
          fi

          ccache --show-stats || true

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"

          if [ "${BUILD_TYPE}" = "production" ]; then
            SEARCH_DIR="android/app/build/outputs/apk/release"
          else
            SEARCH_DIR="android/app/build/outputs/apk/debug"
          fi

          APK_PATH="$(find "${SEARCH_DIR}" -type f -name '*.apk' | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found in ${SEARCH_DIR}" >&2
            exit 1
          fi

          # Rename to a friendly name
          FRIENDLY_NAME="Apex-v${{ steps.version.outputs.app_version }}-${{ steps.version.outputs.build_type }}.apk"
          cp "${APK_PATH}" "${FRIENDLY_NAME}"

          echo "path=${FRIENDLY_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${FRIENDLY_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: apex-android-apk-${{ steps.version.outputs.build_type }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # ── Create GitHub Release with tag ────────────────────────
      - name: Create Git tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APP_VERSION="${{ steps.version.outputs.app_version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"

          # Get previous tag for changelog
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)

          # Build commit log
          if [ -n "${PREV_TAG}" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`)" --no-merges | head -50)
          else
            COMMITS=$(git log --pretty=format:"- %s (\`%h\`)" --no-merges -20)
          fi

          cat > release_notes.md <<EOF
          ## 📱 Apex ${APP_VERSION} (build ${VERSION_CODE})

          **Build type:** \`${BUILD_TYPE}\`
          **Branch:** \`${GITHUB_REF_NAME}\`

          ### 📋 What's changed

          ${COMMITS}

          ### 📦 Installation

          1. Download the \`.apk\` file below
          2. Open it on your Android device
          3. Allow installation from unknown sources if prompted
          4. Enjoy! 🏋️

          ---
          *Built automatically from [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})*
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "Apex ${{ steps.version.outputs.app_version }} (${{ steps.version.outputs.build_type }})" \
            --notes-file release_notes.md \
            --latest

      # ── Publish matching OTA ──────────────────────────────────
      # Keeps the OTA branch in sync with this binary so the app doesn't pull
      # an older bundle over the JS it shipped with.
      - name: Build matching Nitro OTA bundle
        shell: bash
        env:
          OTA_VERSION: ${{ steps.counters.outputs.ota_version }}
        run: |
          set -euo pipefail
          yarn nitro-ota:build --platform android --ota-version "${OTA_VERSION}" \
            --release-notes "Native release ${{ steps.version.outputs.tag }}"

      - name: Publish matching Nitro OTA bundle
        shell: bash
        env:
          OTA_BRANCH: nitro-ota-android-${{ inputs.build_environment || 'production' }}
          OTA_PLATFORM: android
          OTA_VERSION: ${{ steps.counters.outputs.ota_version }}
        run: bash scripts/ota/publish-ota-branch.sh

      # ── Notification ──────────────────────────────────────────
      - name: Post ntfy notification
        if: always() && steps.apk.outcome == 'success'
        shell: bash
        env:
          NTFY_CHANNEL: apex-builds
          APK_FILE: ${{ steps.apk.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          SHORT_SHA="${COMMIT_SHA::7}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          MESSAGE=$(cat <<EOF
          Apex ${TAG} released! 🎉
          Build type: ${BUILD_TYPE}
          File: ${APK_FILE}
          Branch: ${REF_NAME}
          Commit: ${SHORT_SHA}
          Release: ${RELEASE_URL}
          Run: ${RUN_URL}
          EOF
          )

          curl --fail --silent --show-error \
            -H "Title: Apex Release ${TAG}" \
            -H "Tags: android,rocket" \
            -d "${MESSAGE}" \
            "https://ntfy.sh/${NTFY_CHANNEL}" || true
