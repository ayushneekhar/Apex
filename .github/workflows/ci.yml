name: CI

# ─────────────────────────────────────────────────────────────────
# Single entry-point for every push to main.
# Decides once whether the change is native or JS-only, then
# dispatches to the correct downstream workflow.
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/ota/ota-bundle-version.json"
  workflow_dispatch:
    inputs:
      force_route:
        description: Override triage route (auto = detect from latest commit)
        type: choice
        required: false
        default: auto
        options:
          - auto
          - native
          - ota
          - skip

permissions:
  contents: write
  actions: write

# Triage is fast — always process the latest push. Release workflows
# are dispatched independently so they are not cancelled when a newer
# push arrives while triage is still running.
concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  # ── Triage: what kind of change is this? ─────────────────────
  triage:
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.decide.outputs.route }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Decide build route
        id: decide
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FORCE_ROUTE: ${{ inputs.force_route || 'auto' }}
        run: |
          set -euo pipefail

          if [ "$FORCE_ROUTE" != "auto" ]; then
            echo "route=${FORCE_ROUTE}" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual override — route=${FORCE_ROUTE}"
            exit 0
          fi

          # Skip CI commits from bots
          if echo "$COMMIT_MSG" | grep -qF '[skip ci]'; then
            echo "route=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CI — commit message contains [skip ci]"
            exit 0
          fi

          # Explicit [build] tag always forces native build
          if echo "$COMMIT_MSG" | grep -qF '[build]'; then
            echo "route=native" >> "$GITHUB_OUTPUT"
            echo "::notice::Forced native build — commit message contains [build]"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          NATIVE_REGEX='^(android/|ios/|app\.json$|app\.config\.(js|ts|json|mjs|cjs)$|package\.json$|yarn\.lock$|package-lock\.json$|pnpm-lock\.yaml$|bun\.lockb?$)'
          WORKFLOW_REGEX='^\.github/workflows/'

          # Workflow-only changes → skip everything
          NON_WORKFLOW=$(echo "$CHANGED" | grep -Ev "$WORKFLOW_REGEX" || true)
          if [ -z "$NON_WORKFLOW" ]; then
            echo "route=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::Only workflow files changed — skipping"
            exit 0
          fi

          # Any native-relevant file → native build (includes OTA in that workflow)
          if echo "$CHANGED" | grep -Eq "$NATIVE_REGEX"; then
            echo "route=native" >> "$GITHUB_OUTPUT"
            echo "::notice::Native-relevant changes detected → APK release"
          else
            echo "route=ota" >> "$GITHUB_OUTPUT"
            echo "::notice::JS-only changes detected → OTA publish"
          fi

      - name: Summary
        shell: bash
        run: |
          ROUTE="${{ steps.decide.outputs.route }}"
          case "$ROUTE" in
            native) ICON="🏗️"; DESC="Native APK build + GitHub Release" ;;
            ota)    ICON="📡"; DESC="Nitro OTA bundle publish" ;;
            skip)   ICON="⏭️"; DESC="Skipped (workflow-only or [skip ci])" ;;
            *)      ICON="❓"; DESC="Unknown route: $ROUTE" ;;
          esac
          {
            echo "## CI Triage ${ICON}"
            echo ""
            echo "**Route:** \`${ROUTE}\` — ${DESC}"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA::7}\` — ${{ github.event.head_commit.message }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Native path: dispatch APK release as an independent workflow ─
  # Decoupled from this job so a newer push cancelling triage does
  # not prevent an in-flight native build from starting.
  trigger-native-release:
    needs: triage
    if: needs.triage.outputs.route == 'native'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android APK release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-apk-release.yml',
              ref: context.sha,
            });
            core.notice(`Dispatched Android APK release for ${context.sha.slice(0, 7)}`);

  # ── JS path: dispatch OTA publish as an independent workflow ───
  trigger-ota-publish:
    needs: triage
    if: needs.triage.outputs.route == 'ota'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Nitro OTA publish
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-nitro-ota.yml',
              ref: context.sha,
              inputs: {
                deployment_environment: 'production',
                platform: 'android',
                ci_auto_publish: 'true',
              },
            });
            core.notice(`Dispatched Nitro OTA publish for ${context.sha.slice(0, 7)}`);
